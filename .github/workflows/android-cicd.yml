name: 🤖 Flutter Android CI/CD

on:
  push:
    branches:
      - ci_cd_demo_android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Java
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Setup Flutter
      - name: 🧰 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      # Step 4: Install dependencies
      - name: 📦 Install dependencies
        run: flutter pub get

      # Step 5: Analyze code
      - name: 🔍 Analyze code
        run: flutter analyze

      # Step 6: Run tests
      - name: 🧪 Run tests
        run: flutter test

      # Step 7: Decode keystore
      - name: 🔑 Decode Keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      # Step 8: Recreate key.properties
      - name: 🧭 Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      # Step 9: Build release AAB
      - name: 🏗️ Build AAB
        run: flutter build appbundle --release

      # Step 10: Upload artifact
      - name: 📤 Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # Optional: Deploy to Play Store
      - name: 🚀 Deploy to Google Play (Internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.example.app   # 👈 replace with your package name
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
